apiVersion: v1
kind: Secret
metadata:
  name: climate-store-secret
  namespace: climate-store
type: Opaque
stringData:
  POSTGRES_DB: climate_store
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: REPLACE_WITH_A_LOCAL_PASSWORD
  DATABASE_URL: postgresql://postgres:REPLACE_WITH_A_LOCAL_PASSWORD@postgres:5432/climate_store
