apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: climate-store-api
  namespace: climate-store
spec:
  parentRefs:
    - name: climate-store
      sectionName: http
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/products
          method: GET
          headers:
            - type: Exact
              name: x-user-group
              value: beta
      backendRefs:
        - name: backend
          port: 3000
    - matches:
        - path:
            type: Exact
            value: /api/products
          method: GET
      backendRefs:
        - name: backend-green
          port: 3000
