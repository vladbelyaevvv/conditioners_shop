apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: climate-store-envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: climate-store
  namespace: climate-store
spec:
  gatewayClassName: climate-store-envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: climate-store-api
  namespace: climate-store
spec:
  parentRefs:
    - name: climate-store
      sectionName: http
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/products
          method: GET
      backendRefs:
        - name: backend
          port: 3000
